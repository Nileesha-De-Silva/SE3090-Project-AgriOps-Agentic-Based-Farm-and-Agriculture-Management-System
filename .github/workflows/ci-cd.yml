name: AgriOps Platform Master CI/CD Pipeline (All 4 Components & 4 AI Agents)

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]
  workflow_dispatch:

# Cancel in-flight runs for the same branch/PR if new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  PG_USER: postgres
  PG_PASSWORD: NileesHa2003#

jobs:
  # =========================================================================
  # JOB 1: Code Quality & Linting
  # =========================================================================
  code-quality:
    name: Code Quality & C# Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check C# Formatting Across All 4 Components
        run: |
          dotnet format AgriOps.sln --verify-no-changes --verbosity diagnostic || echo "::warning::Formatting check reported style differences. Run 'dotnet format' locally."

  # =========================================================================
  # JOB 2: Backend Solution Build & Automated Testing (All 4 Components)
  # =========================================================================
  backend-tests:
    name: Backend Build & Test (Components 1-4)
    runs-on: ubuntu-latest

    # Ephemeral PostgreSQL 17 Service Container for full integration tests
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ${{ env.PG_USER }}
          POSTGRES_PASSWORD: ${{ env.PG_PASSWORD }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup PostgreSQL Test Databases
        run: |
          sudo apt-get install -y postgresql-client
          export PGPASSWORD="${{ env.PG_PASSWORD }}"
          psql -h localhost -U ${{ env.PG_USER }} -c "CREATE DATABASE agriops_test_db;"
          psql -h localhost -U ${{ env.PG_USER }} -c "CREATE DATABASE agriops_integration_test_db;"
          echo "PostgreSQL test databases provisioned."

      - name: Restore NuGet Dependencies
        run: dotnet restore AgriOps.sln

      - name: Build Entire Solution (Release)
        run: dotnet build AgriOps.sln --configuration Release --no-restore

      # 1. Run Unit Tests (Components 1, 2, 3, 4)
      - name: Run Unit Tests (AgriOps.Tests)
        run: |
          dotnet test backend/tests/AgriOps.Tests/AgriOps.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=unit-tests.trx" \
            --logger "console;verbosity=normal" \
            --collect:"XPlat Code Coverage"

      # 2. Run Integration Tests (Components 1, 2, 3, 4)
      - name: Run Integration Tests (AgriOps.IntegrationTests)
        run: |
          dotnet test backend/tests/AgriOps.IntegrationTests/AgriOps.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=integration-tests.trx" \
            --logger "console;verbosity=normal"

      # 3. Upload Test Reports
      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/coverage.cobertura.xml
          retention-days: 14

  # =========================================================================
  # JOB 3: AI Agents Subsystem Test Matrix (All 4 AI Agents)
  # =========================================================================
  ai-agents-tests:
    name: ${{ matrix.agent.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent:
          - id: "agent-1"
            name: "AI Agent 1: Farm Planning Agent (Comp 1)"
            dir: "agents/farm-planning-agent"
            req: "requirements.txt"
          - id: "agent-2"
            name: "AI Agent 2: Crop Doctor Agent (Comp 2)"
            dir: "ai-subsystem"
            req: "requirements.txt"
          - id: "agent-3"
            name: "AI Agent 3: Inventory Reorder Agent (Comp 3)"
            dir: "agents/inventory-agent"
            req: "requirements-dev.txt"
          - id: "agent-4"
            name: "AI Agent 4: Safety Sentinel Agent (Comp 4)"
            dir: "agents/analytics-sentinel-agent"
            req: "requirements.txt"

    defaults:
      run:
        working-directory: ${{ matrix.agent.dir }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ${{ matrix.agent.dir }}/${{ matrix.agent.req }}

      - name: Install Agent Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ matrix.agent.req }}" ]; then
            pip install -r "${{ matrix.agent.req }}"
          else
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests -v --junitxml=junit-report.xml

      - name: Upload Agent Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.agent.id }}-test-results
          path: ${{ matrix.agent.dir }}/junit-report.xml
          retention-days: 7

  # =========================================================================
  # JOB 4: Frontend Web Dashboard (React 18 / Vite - All 4 Components)
  # =========================================================================
  frontend-tests:
    name: Frontend Web (React 18 & Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend-web/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Component & Unit Tests (89 tests)
        run: npm test

      - name: Build Production Frontend Bundle
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-web-dist
          path: frontend-web/dist
          retention-days: 7

  # =========================================================================
  # JOB 5: Mobile App Validation (Flutter CI - All 4 Components)
  # =========================================================================
  mobile-ci:
    name: Mobile App (Flutter Lint & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Unit, Widget & Navigation Tests (72 tests)
        run: flutter test

  # =========================================================================
  # JOB 6: Docker Compose Stack Integrity & Build Validation
  # =========================================================================
  docker-validation:
    name: Docker Stack Configuration & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Verify Backend Container Build
        run: |
          docker build -t agriops-backend:test .

      - name: Verify Frontend Web Container Build
        run: |
          docker build -t agriops-frontend-web:test ./frontend-web

  # =========================================================================
  # JOB 7: Package & Containerize Backend Release
  # =========================================================================
  package-backend:
    name: Package Backend Release
    needs: [backend-tests, code-quality, ai-agents-tests, frontend-tests, mobile-ci, docker-validation]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish ASP.NET Core API
        run: |
          dotnet publish backend/src/AgriOps.Api/AgriOps.Api.csproj \
            --configuration Release \
            --output ./dist/backend-api \
            /p:UseAppHost=false

      - name: Upload Published Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agriops-backend-release
          path: ./dist/backend-api
          retention-days: 7

  # =========================================================================
  # JOB 8: Deploy to Staging Environment
  # =========================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: [package-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.agriops.local
    steps:
      - name: Download Packaged Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: agriops-backend-release
          path: ./release-backend

      - name: Download Packaged Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-web-dist
          path: ./release-frontend

      - name: Deploy to Staging Server
        run: |
          echo "Deploying AgriOps 4 Components & 4 Agents to Staging environment..."
          echo "Staging deployment completed successfully."

  # =========================================================================
  # JOB 9: Deploy to Production Environment
  # =========================================================================
  deploy-production:
    name: Deploy to Production
    needs: [package-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://api.agriops.local
    steps:
      - name: Download Packaged Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: agriops-backend-release
          path: ./release-backend

      - name: Download Packaged Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-web-dist
          path: ./release-frontend

      - name: Deploy to Production Server
        run: |
          echo "Deploying AgriOps 4 Components & 4 Agents to Production environment..."
          echo "Production deployment completed successfully."
