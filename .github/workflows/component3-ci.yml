name: Component 3 CI (Inventory & Supply Chain Management)

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'backend/src/AgriOps.Api/Controllers/Inventory*'
      - 'backend/src/AgriOps.Api/Controllers/Supplier*'
      - 'backend/src/AgriOps.Api/Controllers/PurchaseRequest*'
      - 'backend/src/AgriOps.Api/Controllers/ReorderRecommendation*'
      - 'backend/src/AgriOps.Core/Entities/Inventory*'
      - 'backend/src/AgriOps.Core/Entities/Supplier*'
      - 'backend/src/AgriOps.Core/Entities/PurchaseRequest*'
      - 'backend/src/AgriOps.Core/Entities/ReorderRecommendation*'
      - 'backend/src/AgriOps.Infrastructure/Data/**'
      - 'agents/inventory-agent/**'
      - 'frontend-web/src/pages/Inventory*'
      - 'frontend-web/src/pages/Suppliers*'
      - 'frontend-web/src/components/inventory/**'
      - 'frontend-web/src/__tests__/inventoryPermissions.test.jsx'
      - 'mobile/lib/inventory_views.dart'
      - 'mobile/lib/scanner.dart'
      - 'mobile/lib/api.dart'
      - 'mobile/lib/workspace.dart'
      - 'mobile/test/inventory*'
      - 'mobile/test/api_test.dart'
      - 'mobile/test/app_test.dart'
      - 'mobile/test/workspace_test.dart'
      - '.github/workflows/component3-ci.yml'
  pull_request:
    branches:
      - main
      - development
    paths:
      - 'backend/src/AgriOps.Api/Controllers/Inventory*'
      - 'backend/src/AgriOps.Api/Controllers/Supplier*'
      - 'backend/src/AgriOps.Api/Controllers/PurchaseRequest*'
      - 'backend/src/AgriOps.Api/Controllers/ReorderRecommendation*'
      - 'backend/src/AgriOps.Core/Entities/Inventory*'
      - 'backend/src/AgriOps.Core/Entities/Supplier*'
      - 'backend/src/AgriOps.Core/Entities/PurchaseRequest*'
      - 'backend/src/AgriOps.Core/Entities/ReorderRecommendation*'
      - 'backend/src/AgriOps.Infrastructure/Data/**'
      - 'agents/inventory-agent/**'
      - 'frontend-web/src/pages/Inventory*'
      - 'frontend-web/src/pages/Suppliers*'
      - 'frontend-web/src/components/inventory/**'
      - 'frontend-web/src/__tests__/inventoryPermissions.test.jsx'
      - 'mobile/lib/inventory_views.dart'
      - 'mobile/lib/scanner.dart'
      - 'mobile/lib/api.dart'
      - 'mobile/lib/workspace.dart'
      - 'mobile/test/inventory*'
      - 'mobile/test/api_test.dart'
      - 'mobile/test/app_test.dart'
      - 'mobile/test/workspace_test.dart'
      - '.github/workflows/component3-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-component-3:
    name: Validate Component 3 & Agent 3 (Inventory & Supply Chain)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Inventory API (.NET 10)
        run: dotnet build backend/src/AgriOps.Api/AgriOps.Api.csproj --configuration Release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agents/inventory-agent/requirements-dev.txt

      - name: Install Agent 3 Dependencies
        working-directory: agents/inventory-agent
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Test Agent 3 (Inventory Reorder Agent - 35 tests)
        working-directory: agents/inventory-agent
        run: python -m pytest tests -v --import-mode=importlib --junitxml=agent3-test-results.xml

      - name: Upload Agent 3 Test Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent3-inventory-test-results
          path: agents/inventory-agent/agent3-test-results.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install Web Dependencies
        working-directory: frontend-web
        run: npm ci

      - name: Test Web Dashboard (Inventory & Role-Based Permissions)
        working-directory: frontend-web
        run: npm test

      - name: Build Web Application Bundle
        working-directory: frontend-web
        run: npm run build

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Test Mobile Inventory, QR Scanner & Workspaces
        working-directory: mobile
        run: flutter test test/inventory_views_test.dart test/inventory_permissions_test.dart test/api_test.dart test/app_test.dart test/workspace_test.dart
