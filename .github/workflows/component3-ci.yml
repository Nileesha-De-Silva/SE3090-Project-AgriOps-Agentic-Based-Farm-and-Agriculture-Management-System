name: Component 3 CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-component-3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build inventory API
        run: dotnet build backend/src/AgriOps.Api/AgriOps.Api.csproj --configuration Release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agent dependencies
        working-directory: agents/inventory-agent
        run: python -m pip install -r requirements-dev.txt

      - name: Test inventory agent
        working-directory: agents/inventory-agent
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install web dependencies
        working-directory: frontend-web
        run: npm ci

      - name: Test web app
        working-directory: frontend-web
        run: npm test

      - name: Build web app
        working-directory: frontend-web
        run: npm run build

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Test Flutter mobile app
        working-directory: mobile
        run: flutter test test/inventory_views_test.dart test/api_test.dart test/app_test.dart test/workspace_test.dart
