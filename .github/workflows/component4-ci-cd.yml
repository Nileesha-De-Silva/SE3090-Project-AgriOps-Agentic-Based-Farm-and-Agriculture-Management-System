name: Component 4 - CI/CD Pipeline (Analytics, Production & Safety Sentinel)

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
    paths:
      - 'backend/src/AgriOps.Api/Controllers/Analytics*'
      - 'backend/src/AgriOps.Api/Controllers/ValidationSafety*'
      - 'backend/src/AgriOps.Api/Controllers/MultiAgentAssessedWorkflow*'
      - 'backend/src/AgriOps.Api/Controllers/InventoryAgent*'
      - 'backend/src/AgriOps.Infrastructure/Services/ValidationSafety*'
      - 'backend/src/AgriOps.Infrastructure/Services/WeatherService*'
      - 'backend/src/AgriOps.Core/Entities/ValidationResult*'
      - 'backend/src/AgriOps.Core/Entities/AuditLogs*'
      - 'agents/analytics-sentinel-agent/**'
      - 'frontend-web/src/pages/Analatics*'
      - 'frontend-web/src/components/analytics/**'
      - 'frontend-web/src/services/validationSafetyApi.js'
      - 'frontend-web/src/services/multiAgentWorkflowApi.js'
      - 'mobile/lib/screens/analytics_screen.dart'
      - 'mobile/lib/api/analytics_api.dart'
      - 'mobile/test/analytics_screen_test.dart'
      - 'mobile/test/api/analytics_api_test.dart'
      - '.github/workflows/component4-ci-cd.yml'
  pull_request:
    branches:
      - main
      - development
    paths:
      - 'backend/src/AgriOps.Api/Controllers/Analytics*'
      - 'backend/src/AgriOps.Api/Controllers/ValidationSafety*'
      - 'backend/src/AgriOps.Api/Controllers/MultiAgentAssessedWorkflow*'
      - 'backend/src/AgriOps.Api/Controllers/InventoryAgent*'
      - 'backend/src/AgriOps.Infrastructure/Services/ValidationSafety*'
      - 'backend/src/AgriOps.Infrastructure/Services/WeatherService*'
      - 'backend/src/AgriOps.Core/Entities/ValidationResult*'
      - 'backend/src/AgriOps.Core/Entities/AuditLogs*'
      - 'agents/analytics-sentinel-agent/**'
      - 'frontend-web/src/pages/Analatics*'
      - 'frontend-web/src/components/analytics/**'
      - 'frontend-web/src/services/validationSafetyApi.js'
      - 'frontend-web/src/services/multiAgentWorkflowApi.js'
      - 'mobile/lib/screens/analytics_screen.dart'
      - 'mobile/lib/api/analytics_api.dart'
      - 'mobile/test/analytics_screen_test.dart'
      - 'mobile/test/api/analytics_api_test.dart'
      - '.github/workflows/component4-ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ========================================================
  # Job 1: Backend CI (.NET 10 Web API - Component 4)
  # ========================================================
  backend-ci:
    name: Backend CI (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore backend/src/AgriOps.Api/AgriOps.Api.csproj

      - name: Build Backend (Release)
        run: dotnet build backend/src/AgriOps.Api/AgriOps.Api.csproj --configuration Release --no-restore

      - name: Publish Build Artifacts
        run: dotnet publish backend/src/AgriOps.Api/AgriOps.Api.csproj -c Release -o ./publish/backend /p:UseAppHost=false

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-build
          path: ./publish/backend
          retention-days: 7

  # ========================================================
  # Job 2: Agent 4 CI (Analytics & Safety Sentinel Agent)
  # ========================================================
  agent4-ci:
    name: Agent 4 CI (Safety Sentinel Agent - 24 tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agents/analytics-sentinel-agent/requirements.txt

      - name: Install Agent 4 Dependencies
        working-directory: agents/analytics-sentinel-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Agent 4 (Sentinel Workflow & Rule Engine)
        working-directory: agents/analytics-sentinel-agent
        run: python -m pytest tests -v --import-mode=importlib --junitxml=sentinel-test-results.xml

      - name: Upload Sentinel Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent4-sentinel-test-results
          path: agents/analytics-sentinel-agent/sentinel-test-results.xml
          retention-days: 7

  # ========================================================
  # Job 3: Frontend CI (React 18 / Vite - Component 4)
  # ========================================================
  frontend-ci:
    name: Frontend CI (React 18 / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test

      - name: Build Frontend Bundle
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-web/dist
          retention-days: 7

  # ========================================================
  # Job 4: Mobile CI (Analytics Screen Flutter Test)
  # ========================================================
  mobile-ci:
    name: Mobile CI (Analytics Screen)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Test Analytics Screen Widget & State
        run: flutter test test/analytics_screen_test.dart test/api/analytics_api_test.dart

  # ========================================================
  # Job 5: Continuous Deployment
  # ========================================================
  deploy:
    name: Deploy to Production
    needs: [backend-ci, agent4-ci, frontend-ci, mobile-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-api-build
          path: ./backend-artifact

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend-artifact

      - name: Production Deployment Step
        run: echo "Component 4 and Agent 4 artifacts validated and successfully staged for production deployment."
