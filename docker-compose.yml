services:
  # =========================================================================
  # 1. ASP.NET Core Backend API (Component 1 & Component 2)
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriops-backend
    restart: on-failure
    ports:
      - "5286:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - InventoryAgent__BaseUrl=http://inventory-agent:8003/
      - InventoryAgent__AutomaticReorderEnabled=true
      - InventoryAgent__ClientId=${INVENTORY_AGENT_CLIENT_ID:-inventory.agent}
      - InventoryAgent__ClientSecret=${INVENTORY_AGENT_CLIENT_SECRET:-}
      - Jwt__Key=AgriOpsPlatformSecretSigningKeyForEvaluationAndDockerEnvironment2026!
      - Jwt__Issuer=AgriOpsAI
      - Jwt__Audience=AgriOpsAIUsers
      # Connects directly to your local PostgreSQL where pgAdmin and tables reside
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=5432;Database=agriops_db(Component 2);Username=postgres;Password=NileesHa2003#
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =========================================================================
  # 2. Python AI Agent Subsystem (FastAPI / Uvicorn)
  # =========================================================================
  ai-subsystem:
    build:
      context: ./ai-subsystem
      dockerfile: Dockerfile
    container_name: agriops-ai-subsystem
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =========================================================================
  # 3. Component 1 AI Agent: Farm Planning Agent (FastAPI / LangGraph)
  # =========================================================================
  farm-planning-agent:
    build:
      context: ./agents/farm-planning-agent
      dockerfile: Dockerfile
    container_name: agriops-farm-planning-agent
    restart: on-failure
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - BACKEND_API_URL=http://backend:8080/api
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =========================================================================
  # 4. Component 3 AI Agent: Inventory Reorder Agent (FastAPI / LangGraph)
  # =========================================================================
  inventory-agent:
    build:
      context: ./agents/inventory-agent
      dockerfile: Dockerfile
    container_name: agriops-inventory-agent
    restart: on-failure
    ports:
      - "8003:8003"
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CHAT_MODEL=${CHAT_MODEL:-}
      - BACKEND_AGENT_TOKEN=${BACKEND_AGENT_TOKEN:-}
      - BACKEND_AGENT_CLIENT_ID=${INVENTORY_AGENT_CLIENT_ID:-inventory.agent}
      - BACKEND_AGENT_CLIENT_SECRET=${INVENTORY_AGENT_CLIENT_SECRET:-}
      - CHECKPOINT_DB=/app/data/checkpoints.sqlite
      - BACKEND_API_URL=http://backend:8080/api
    volumes:
      - inventory-agent-data:/app/data
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =========================================================================
  # 5. Component 4 AI Agent: Validation & Safety Agent (FastAPI / LangGraph)
  # =========================================================================
  analytics-agent:
    build:
      context: ./agents/analytics-sentinel-agent
      dockerfile: Dockerfile
    container_name: agriops-agent4-validation-safety
    restart: on-failure
    ports:
      - "8004:8004"
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - BACKEND_API_URL=http://backend:8080/api
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =========================================================================
  # 6. React Web Dashboard (Vite)
  # =========================================================================
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: agriops-frontend-web
    restart: on-failure
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8080
      - AGENT2_URL=http://ai-subsystem:8000
      - AGENT1_URL=http://farm-planning-agent:8001
      - AGENT3_URL=http://inventory-agent:8003
      - AGENT4_URL=http://analytics-agent:8004
    volumes:
      - ./frontend-web/src:/app/src
      - ./frontend-web/index.html:/app/index.html
      - ./frontend-web/vite.config.js:/app/vite.config.js

  # =========================================================================
  # 5. Flutter Mobile App (Browser Container)
  # =========================================================================
  mobile-web:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: agriops-mobile-web
    restart: on-failure
    depends_on:
      - backend
    ports:
      - "8085:80"
    profiles:
      - full
      - mobile



volumes:
  inventory-agent-data:
